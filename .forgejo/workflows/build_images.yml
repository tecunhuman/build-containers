name: docker_builds

on:
  push:
    branches:
      - main
  schedule:
    - cron:  '0 0 1 * *'
  workflow_dispatch:

env:
  VERSION: v1
  REGISTRY: forge.lan:3000/tecunhuman
  DOCKER_HOST: tcp://127.0.0.1:2375

jobs:
  build-and-push-linux-image:
    name: Linux (Ubuntu)
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/godot-ubuntu:$VERSION -t $REGISTRY/godot-ubuntu:latest platform/ubuntu
          docker push $REGISTRY/godot-ubuntu:$VERSION
          docker push $REGISTRY/godot-ubuntu:latest

  build-and-push-windows-image:
    name: Windows (MinGW)
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/godot-mingw:$VERSION -t $REGISTRY/godot-mingw:latest platform/mingw
          docker push $REGISTRY/godot-mingw:$VERSION
          docker push $REGISTRY/godot-mingw:latest

  build-and-push-macos-image:
    name: MacOS (osxcross)
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/godot-osxcross:$VERSION -t $REGISTRY/godot-osxcross:latest platform/osxcross
          docker push $REGISTRY/godot-osxcross:$VERSION
          docker push $REGISTRY/godot-osxcross:latest

  build-and-push-ios-image:
    name: iOS (ioscross)
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        env:
          IOSCROSS_PASSWORD: ${{ secrets.IOSCROSS_PASSWORD }}
        run: |
          docker build --build-arg DOWNLOAD_URL=${{ vars.IOSCROSS_DOWNLOAD_URL }} \
            --secret id=IOSCROSS_PASSWORD,env=IOSCROSS_PASSWORD \
            -t $REGISTRY/godot-ioscross:$VERSION -t $REGISTRY/godot-ioscross:latest platform/ioscross
          docker push $REGISTRY/godot-ioscross:$VERSION
          docker push $REGISTRY/godot-ioscross:latest

  build-and-push-android-image:
    name: Android
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/godot-android:$VERSION -t $REGISTRY/godot-android:latest platform/android
          docker push $REGISTRY/godot-android:$VERSION
          docker push $REGISTRY/godot-android:latest

  build-and-push-wasm-image:
    name: Wasm (emscripten)
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        run: echo ${{ secrets.REGISTRY_TOKEN }} | docker login forge.lan:3000 -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/godot-wasm:$VERSION -t $REGISTRY/godot-wasm:latest platform/web
          docker push $REGISTRY/godot-wasm:$VERSION
          docker push $REGISTRY/godot-wasm:latest
